[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rookie-agent"
version = "0.0.2"
description = "A local, verifiable coding agent for real projects."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2.44.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "textual>=6.7.0",
    "rich>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/CIA-Dao/rookie-agent"
Repository = "https://github.com/CIA-Dao/rookie-agent"
Issues = "https://github.com/CIA-Dao/rookie-agent/issues"

[project.scripts]
my-agent = "my_agent.cli.main:main"
my-agent-core = "my_agent.core.app:run"
my-agent-tui = "my_agent.tui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
